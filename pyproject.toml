[project]
name = "sklarstad-storefront-mcp"
version = "0.1.3"
description = "MCP server that lets AI assistants look up Sklarstad LLC's products (FirstTake: video production from shoot to delivered master)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sklarstad LLC", email = "sklarstad@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "video-production", "filmmaking", "davinci-resolve", "premiere-pro"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Video",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "mcp[cli]>=2.0.0",
]

[project.urls]
Repository = "https://github.com/sklarstad/sklarstad-storefront-mcp"

[project.scripts]
sklarstad-storefront-mcp = "sklarstad_storefront_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sklarstad_storefront_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/sklarstad_storefront_mcp/catalog.json" = "sklarstad_storefront_mcp/catalog.json"
